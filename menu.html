<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANGÚSTIA</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #000;
            color: #ddd;
            font-family: Georgia, "Times New Roman", serif;
        }

        .intro {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url("televison.gif");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            animation: aparecer 3s ease forwards;
        }

        .intro::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(
                rgba(0, 0, 0, 0.85),
                rgba(0, 0, 0, 0.95)
            );
        }

        .noise {
            position: absolute;
            inset: 0;
            opacity: 0.045;
            pointer-events: none;
            background-image: repeating-linear-gradient(
                0deg,
                transparent 0px,
                transparent 2px,
                rgba(255, 255, 255, 0.8) 3px
            );
            animation: ruido 0.12s infinite;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 800px;
            text-align: center;
        }

        .titulo {
            opacity: 0;
            font-size: clamp(55px, 11vw, 130px);
            font-weight: normal;
            letter-spacing: 18px;
            color: #e5e5e5;
            text-transform: uppercase;
            text-shadow:
                0 0 8px rgba(255, 255, 255, 0.2),
                0 0 30px rgba(255, 255, 255, 0.05);
            animation:
                tituloEntrada 4s ease forwards,
                tituloFalha 5s 4s infinite;
        }

        .subtitulo {
            opacity: 0;
            margin-top: 20px;
            font-family: Arial, sans-serif;
            font-size: 11px;
            letter-spacing: 5px;
            color: #777;
            animation: aparecerTexto 2s 3s ease forwards;
        }

        .creditos {
            opacity: 0;
            margin-top: 65px;
            animation: aparecerTexto 2s 5s ease forwards;
        }

        .creditos h2 {
            font-family: Arial, sans-serif;
            font-size: 11px;
            font-weight: normal;
            letter-spacing: 4px;
            color: #777;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .nomes {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px 25px;
            max-width: 600px;
            margin: auto;
        }

        .nomes span {
            font-size: 14px;
            color: #bdbdbd;
            transition: color 0.3s;
        }

        .nomes span:hover {
            color: white;
        }

        .informacoes {
            opacity: 0;
            margin-top: 35px;
            animation: aparecerTexto 2s 6s ease forwards;
        }

        .informacoes p {
            margin: 6px;
            font-family: Arial, sans-serif;
            font-size: 11px;
            letter-spacing: 2px;
            color: #666;
        }

        .informacoes strong {
            color: #aaa;
            font-weight: normal;
        }

        .botao {
            opacity: 0;
            margin-top: 45px;
            padding: 14px 45px;
            border: 1px solid #666;
            background: transparent;
            color: #ccc;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 13px;
            letter-spacing: 4px;
            text-transform: uppercase;
            cursor: pointer;
            transition:
                background 0.4s,
                color 0.4s,
                border-color 0.4s,
                box-shadow 0.4s;
            animation: aparecerTexto 2s 8s ease forwards;
        }

        .botao:hover {
            background: #ddd;
            color: #050505;
            border-color: #ddd;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.15);
        }

        .botao:active {
            transform: scale(0.97);
        }

        @keyframes aparecer {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes tituloEntrada {
            0% {
                opacity: 0;
                transform: scale(1.15) translateY(10px);
                filter: blur(12px);
            }
            35% { opacity: 1; }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: blur(0);
            }
        }

        @keyframes tituloFalha {
            0%, 90%, 100% { transform: translateX(0); }
            92% { transform: translateX(-2px); }
            94% { transform: translateX(3px); }
            96% { transform: translateX(-1px); }
        }

        @keyframes aparecerTexto {
            from {
                opacity: 0;
                transform: translateY(15px);
                filter: blur(5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        @keyframes ruido {
            0% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
            100% { transform: translateY(3px); }
        }

        @media (max-width: 600px) {
            .titulo {
                letter-spacing: 8px;
            }

            .creditos {
                margin-top: 40px;
            }

            .nomes {
                gap: 7px 15px;
            }

            .nomes span {
                font-size: 12px;
            }

            .informacoes p {
                font-size: 10px;
                letter-spacing: 1px;
            }

            .botao {
                margin-top: 30px;
            }
        }
    </style>
</head>

<body>

    <!-- Música de fundo -->
    <audio id="musicaFundo" loop preload="auto">
        <source src="som_tela_jogo.mp3" type="audio/mpeg">
        Seu navegador não suporta áudio.
    </audio>

    <main class="intro">
        <div class="noise"></div>

        <div class="container">

            <h1 class="titulo">ANGÚSTIA</h1>

            <p class="subtitulo">
                UMA REFLEXÃO SOBRE A LIBERDADE
            </p>

            <section class="creditos">
                <h2>Desenvolvido por</h2>

                <div class="nomes">
                    <span>Guilherme Arthur</span>
                    <span>João Guilherme</span>
                    <span>João Riquelme</span>
                    <span>Flora de Sá</span>
                    <span>Matheus Emanoel</span>
                    <span>Manoel Viana</span>
                </div>
            </section>

            <section class="informacoes">
                <p>
                    <strong>Professor orientador:</strong>
                    Thiago Melgaço
                </p>

                <p>3º INF MAT — 2026</p>
                <p>Trabalho de Filosofia</p>
            </section>

            <button class="botao" onclick="comecarJogo()">
                Começar
            </button>

        </div>
    </main>

    <script>
        const musica = document.getElementById("musicaFundo");

        // Inicia a música na primeira interação do jogador.
        let musicaIniciada = false;

        function iniciarMusica() {
            if (musicaIniciada) return;

            musica.volume = 0.35;

            musica.play()
                .then(() => {
                    musicaIniciada = true;
                })
                .catch((erro) => {
                    console.log("A música não pôde iniciar:", erro);
                });
        }

        // Qualquer clique na tela pode iniciar a música.
        document.addEventListener("click", iniciarMusica);

        function comecarJogo() {
            iniciarMusica();

            // Altere para o arquivo que inicia o jogo.
            window.location.href = "start.html";
        }
    </script>

</body>
</html>
